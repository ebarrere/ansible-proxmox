---
- name: Add proxmox apt repo
  ansible.builtin.import_tasks: switch_to_community_updates_repo.yml
  when: install_proxmox | d(false)
  tags: bootstrap

- name: Ensure Proxmox is installed
  ansible.builtin.import_tasks: install.yml
  when: install_proxmox | d(false)
  tags: bootstrap

- name: Switch to community APT repo
  ansible.builtin.import_tasks: switch_to_community_updates_repo.yml
  when: switch_to_community_updates_repo
  tags: bootstrap

- name: Update Proxmox
  ansible.builtin.import_tasks: update.yml
  tags: bootstrap

- name: Disable Proxmox Subscription prompt
  ansible.builtin.import_tasks: disable_subscription_prompt.yml
  when: disable_no_subscription_prompt

- name: Configure serial console
  ansible.builtin.import_tasks: serial_console.yml
  when: configure_serial_console | bool
  tags: serial

- name: Install Dark Theme
  ansible.builtin.import_tasks: install_pve_dark_theme.yml
  when: install_pve_discord_dark_theme

- name: Enable ACME certificate management
  ansible.builtin.import_tasks: acme/enable_acme.yml
  when: enable_acme

- name: Determine cluster primary (a healthy member, not a down/rebuilt node)
  ansible.builtin.import_tasks: determine_primary.yml
  tags: [cluster, ceph]

- name: Create cluster
  ansible.builtin.import_tasks: create_cluster.yml
  when: proxmox_create_cluster
  tags: cluster

- name: Mount storage
  ansible.builtin.import_tasks: add_storage.yml
  when: storage_classes is defined and storage_classes is mapping

- name: Setup Ceph
  ansible.builtin.import_tasks: setup_ceph.yml
  tags: ceph

- name: Install NGINX
  ansible.builtin.import_tasks: install_nginx.yml
  when: install_nginx_proxy

- name: Setup GPU passthrough
  ansible.builtin.import_tasks: pcie_passthrough.yml
  when: pcie_passthrough.enable
