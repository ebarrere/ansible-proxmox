---
# When force_replication_rebuild=true, nuke this VM's replication job(s) and
# every off-node replica of its disks, so the job below re-clones fresh. Needed
# after a VM is rebuilt: its new disks share no snapshot with the old replicas,
# so sync fails with "no common base snapshot / volume already exists".
- name: Force-rebuild replication VM-{{ vm.key }}
  when: force_replication_rebuild | default(false) | bool
  block:
    - name: Delete existing replication job(s) for VM-{{ vm.key }}
      ansible.builtin.shell: >-
        set -o pipefail;
        pvesr status 2>/dev/null | awk '$1 ~ /^{{ vm.key }}-/ {print $1}'
        | xargs -r -n1 -I{} pvesr delete {} --force
      args:
        executable: /bin/bash
      changed_when: true
      failed_when: false

    - name: Free stale VM-{{ vm.key }} replicas on other nodes
      ansible.builtin.shell: >-
        set -o pipefail;
        pvesm list {{ vm.value.storage | default(vm_localstorage) }} --vmid {{ vm.key }} 2>/dev/null
        | awk 'NR>1 {print $1}'
        | xargs -r -n1 pvesm free
      args:
        executable: /bin/bash
      delegate_to: "{{ target_node }}"
      changed_when: true
      failed_when: false
      loop: "{{ groups['proxmox'] | difference([inventory_hostname]) }}"
      loop_control:
        loop_var: target_node
        label: "{{ target_node }}"

- name: Get replication configuration VM-{{ vm.key }}
  ansible.builtin.command: >-
    pvesh get /nodes/{{ ansible_facts.hostname }}/replication/{{ vm.key }}-0/status --output-format json
  changed_when: false
  failed_when: replication_config.rc not in [0, 255]
  register: replication_config

- name: Configure replication VM-{{ vm.key }}
  ansible.builtin.command: >-
    pvesr create-local-job {{ vm.key }}-0 {{ replication_target.host }} --schedule "{{ replication_target.schedule | default('daily') }}" \
    --rate {{ replication_target.rate | default('10') }}
  changed_when: true
  when: replication_config.rc == 255
  with_items: "{{ vm.value.replication_targets }}"
  loop_control:
    loop_var: replication_target
