
- name: Get Ceph network
  ansible.builtin.set_fact:
    ceph_ips: "{{ groups['proxmox'] | map('extract', hostvars, 'host_networks') | flatten() | selectattr('tags', 'defined') | selectattr('tags', 'equalto', 'ceph_network') | map(attribute='address') | list }}"
    ceph_network: "{{ host_networks | selectattr('tags', 'defined') | selectattr('tags', 'equalto', 'ceph_network') | map(attribute='address') | map('regex_replace', '[0-9]+$', '0/24') | first }}"

- name: Check if Ceph is installed
  command: ceph --version
  register: ceph_installed
  changed_when: false
  failed_when: false

- name: Install Ceph
  shell: yes | pveceph install --repository no-subscription
  when: ceph_installed.rc != 0

- name: Check if Ceph cluster is initialized
  stat:
    path: /etc/pve/ceph.conf
  register: ceph_conf
  run_once: true
  delegate_to: "{{ groups['proxmox'] | sort | first }}"

- name: Initialize Ceph cluster on primary node
  command: pveceph init --network {{ ceph_network }}
  run_once: true
  delegate_to: "{{ groups['proxmox'] | sort | first }}"
  when: not ceph_conf.stat.exists

- name: Check if monitor exists on primary node
  stat:
    path: /var/lib/ceph/mon/ceph-{{ groups['proxmox'] | sort | first }}
  register: mon_primary
  run_once: true
  delegate_to: "{{ groups['proxmox'] | sort | first }}"

- name: Create first Ceph monitor
  command: pveceph mon create
  run_once: true
  delegate_to: "{{ groups['proxmox'] | sort | first }}"
  when: not mon_primary.stat.exists

- name: Wait for first monitor to be stable
  pause:
    seconds: 30
  when: not mon_primary.stat.exists

- name: Check if monitor exists on remaining nodes
  stat:
    path: /var/lib/ceph/mon/ceph-{{ inventory_hostname }}
  register: mon_exists
  when: inventory_hostname != groups['proxmox'] | sort | first

- name: Create Ceph monitors on remaining nodes
  command: pveceph mon create
  when:
    - inventory_hostname != groups['proxmox'] | sort | first
    - not mon_exists.stat.exists

- name: Check if manager exists on remaining nodes
  stat:
    path: /var/lib/ceph/mgr/ceph-{{ inventory_hostname }}
  register: mgr_exists
  when: inventory_hostname != groups['proxmox'] | sort | first

- name: Create Ceph manager on remaining nodes
  command: pveceph mgr create
  when:
    - inventory_hostname != groups['proxmox'] | sort | first
    - not mgr_exists.stat.exists

- name: Check if OSD exists on partition
  command: ceph-volume lvm list {{ disk.device }}p{{ disk.partitions.ceph.partition_number }}
  register: osd_exists
  changed_when: false
  failed_when: false

- name: Create Ceph OSDs
  command: >
    pveceph osd create {{ disk.device }}p{{ disk.partitions.ceph.partition_number }}
  when: osd_exists.rc != 0

- name: Check if Ceph pool exists
  shell: ceph osd pool ls | grep -q "^{{ ceph_pool_name }}$"
  register: pool_exists
  run_once: true
  delegate_to: "{{ groups['proxmox'] | sort | first }}"
  changed_when: false
  failed_when: false

- name: Create Ceph pool on primary node
  command: >
    pveceph pool create {{ ceph_pool_name }} --add_storages
  run_once: true
  delegate_to: "{{ groups['proxmox'] | sort | first }}"
  when: pool_exists.rc != 0

- name: Get Ceph credentials
  become: true
  delegate_to: "{{ groups['proxmox'] | sort | first }}"
  run_once: true
  block:
    - name: Get Ceph FSID
      command: ceph fsid
      register: ceph_fsid_result
      changed_when: false

    - name: Create/get Ceph user for Kubernetes
      command: >
        ceph auth get-or-create client.{{ ceph_user_name }} -f json
        mon 'profile rbd'
        osd 'profile rbd pool={{ ceph_pool_name }}'
        mgr 'profile rbd pool={{ ceph_pool_name }}'
      register: ceph_user_result
      changed_when: false

    - name: Format Ceph data
      set_fact:
        ceph_data:
          ceph_pool_name: "{{ ceph_pool_name }}"
          ceph_user_name: "{{ ceph_user_name }}"
          ceph_fsid: "{{ ceph_fsid_result.stdout.strip() }}"
          ceph_k8s_key: "{{ (ceph_user_result.stdout | from_json)[0].key }}"
          # ceph_monitors: "{{ groups['proxmox'] | map('extract', hostvars, 'ansible_default_ipv4') | map(attribute='address') | map('regex_replace', '^(.*)$', '\\1:6789') | list }}"
          ceph_monitors: "{{ ceph_ips | map('regex_replace', '^(.*)$', '\\1:6789') | list }}"

- name: Write Ceph data to a local file
  become: false
  copy:
    content: "{{ ceph_data | to_json }}"
    dest: "{{ ceph_data_output_path }}"
  delegate_to: "localhost"
  when: ceph_data_output_path is defined
  run_once: true

- name: Check if MDS exists on this node
  stat:
    path: /var/lib/ceph/mds/ceph-{{ inventory_hostname }}
  register: mds_exists

- name: Create Ceph MDS
  command: pveceph mds create
  when: not mds_exists.stat.exists

- name: Check if CephFS filesystem exists
  command: ceph fs ls --format json
  register: cephfs_list
  run_once: true
  delegate_to: "{{ groups['proxmox'] | sort | first }}"
  changed_when: false

- name: Create CephFS filesystem
  command: pveceph fs create --name {{ cephfs_name }} --pg_num {{ cephfs_pg_num | default(16) }}
  register: cephfs_create_result
  run_once: true
  delegate_to: "{{ groups['proxmox'] | sort | first }}"
  when: cephfs_list.stdout | from_json | selectattr('name', 'equalto', cephfs_name) | list | length == 0
  failed_when: >
    cephfs_create_result.rc != 0 or
    'mon_cmd failed' in (cephfs_create_result.stdout | default('')) or
    'mon_cmd failed' in (cephfs_create_result.stderr | default(''))

- name: Wait for CephFS MDS to become active
  shell: ceph fs status {{ cephfs_name }} | grep -q 'active'
  register: mds_active_check
  until: mds_active_check.rc == 0
  retries: 12
  delay: 10
  run_once: true
  delegate_to: "{{ groups['proxmox'] | sort | first }}"
  changed_when: false
  failed_when: false
  when: cephfs_list.stdout | from_json | selectattr('name', 'equalto', cephfs_name) | list | length == 0

- name: Check if CephFS subvolume group exists
  command: ceph fs subvolumegroup ls {{ cephfs_name }} --format json
  register: cephfs_subvolumegroups
  run_once: true
  delegate_to: "{{ groups['proxmox'] | sort | first }}"
  changed_when: false
  when: cephfs_subvolumegroup_name is defined

- name: Create CephFS subvolume group for Kubernetes
  command: ceph fs subvolumegroup create {{ cephfs_name }} {{ cephfs_subvolumegroup_name }}
  run_once: true
  delegate_to: "{{ groups['proxmox'] | sort | first }}"
  when:
    - cephfs_subvolumegroup_name is defined
    - cephfs_subvolumegroups.stdout | from_json | selectattr('name', 'equalto', cephfs_subvolumegroup_name) | list | length == 0

- name: Get CephFS credentials for Kubernetes
  become: true
  delegate_to: "{{ groups['proxmox'] | sort | first }}"
  run_once: true
  block:
    - name: Create/get CephFS user for Kubernetes
      command: >
        ceph auth get-or-create client.{{ cephfs_user_name }} -f json
        mon 'allow r'
        mds 'allow rw'
        osd 'allow rw tag cephfs *={{ cephfs_name }}'
        mgr 'allow rw'
      register: cephfs_user_result
      changed_when: false

    - name: Format CephFS data
      set_fact:
        cephfs_data:
          ceph_fs_name: "{{ cephfs_name }}"
          ceph_user_name: "{{ cephfs_user_name }}"
          ceph_subvolumegroup_name: "{{ cephfs_subvolumegroup_name | default('') }}"
          ceph_fsid: "{{ ceph_data.ceph_fsid }}"
          ceph_k8s_key: "{{ (cephfs_user_result.stdout | from_json)[0].key }}"
          ceph_monitors: "{{ ceph_data.ceph_monitors }}"

- name: Write CephFS data to a local file
  become: false
  copy:
    content: "{{ cephfs_data | to_json }}"
    dest: "{{ cephfs_data_output_path }}"
  delegate_to: "localhost"
  when: cephfs_data_output_path is defined
  run_once: true