---
# PVE 9 ships the enterprise repo as a deb822 .sources file, which the
# apt_repository removals below (list format) don't touch -- it then 401s on
# every apt update, so it must go FIRST, before any apt cache refresh.
- name: Find deb822 enterprise repo files
  ansible.builtin.shell: |
    set -o pipefail
    grep -rlE 'enterprise\.proxmox\.com' /etc/apt/sources.list.d/*.sources 2>/dev/null || true
  args:
    executable: /bin/bash
  register: pve_enterprise_sources
  changed_when: false
  check_mode: false

- name: Remove deb822 enterprise repositories
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ pve_enterprise_sources.stdout_lines }}"

# gnupg because ansible.builtin.apt_repository shells out to apt-key/gpg, and
# trixie has neither: Debian 13's apt depends on sqv (Sequoia) instead of gpgv,
# so a minimal install carries no gpg at all. Bookworm's apt pulled gnupg in,
# which is why this only shows up on a freshly installed PVE 9 node and not on
# one upgraded from PVE 8.
- name: Ensure ca-certificates and gnupg are installed
  ansible.builtin.apt:
    name:
      - ca-certificates
      - gnupg
    state: present

- name: Download Proxmox GPG key
  ansible.builtin.get_url:
    url: https://enterprise.proxmox.com/debian/proxmox-release-{{ debian_version }}.gpg
    dest: /etc/apt/trusted.gpg.d/proxmox-release-{{ debian_version }}.gpg
    mode: '0644'

- name: Remove enterprise repositories
  ansible.builtin.apt_repository:
    repo: "{{ item.repo }}"
    state: absent
    update_cache: true
    filename: "{{ item.filename }}"
  loop_control:
    label: "{{ item.filename }}"
  with_items:
    - { filename: pve, repo: "deb https://enterprise.proxmox.com/debian/pve {{ debian_version }} pve-enterprise" }
    - { filename: ceph, repo: "deb https://enterprise.proxmox.com/debian/ceph-{{ ceph_release }} {{ debian_version }} enterprise" }

- name: Add no-subscription repositories
  ansible.builtin.apt_repository:
    repo: "{{ item.repo }}"
    state: present
    update_cache: true
    filename: "{{ item.filename }}"
  loop_control:
    label: "{{ item.filename }}"
  with_items:
    - { filename: pve-no-subscription, repo: "deb http://download.proxmox.com/debian/pve {{ debian_version }} pve-no-subscription" }
    - { filename: "ceph-{{ ceph_release }}-no-subscription", repo: "deb http://download.proxmox.com/debian/ceph-{{ ceph_release }} {{ debian_version }} no-subscription" }
