---
update_packages: true

# Serial console (boot + login over the serial port). On the M910q the physical
# header is the 2F8 UART = Linux ttyS1 = GRUB unit 1 (ttyS0/3F8 is a phantom node
# and errors on write). Matches the 115200 8N1 set by the m910q BIOS image.
configure_serial_console: false
serial_console_tty: ttyS1
serial_console_speed: 115200
serial_console_unit: 1

# UEFI boot order (nvme/OS -> USB -> network last) via efibootmgr. Not settable
# by the m910q pre-boot image (boot order is not in the AMI Setup varstore).
configure_uefi_boot_order: false

switch_to_community_updates_repo: true
disable_no_subscription_prompt: true
install_pve_discord_dark_theme: true
enable_acme: false
install_nginx_proxy: true

managed_by_ansible_tag: managed_by_ansible

vm_iso_remove_unreferenced: true
ct_template_remove_unreferenced: true
vm_remove_unreferenced: true
container_remove_unreferenced: true

vm_restart_timeout: 240

vm_defaults_agent: true
vm_defaults_bios: seabios
vm_defaults_cores: 1
vm_defaults_cpu: host
vm_defaults_memory: 512
vm_defaults_onboot: false
vm_defaults_bootorder: false
vm_defaults_machine: q35
vm_defaults_ostype: l26
vm_defaults_scsihw: virtio-scsi-pci
vm_defaults_sockets: 1
vm_defaults_vga: qxl
vm_defaults_netdev_firewall: true
vm_defaults_netdev_type: virtio
vm_defaults_netdev_bridge: vmbr0

container_defaults:
  cores: 1
  memory: 512
  swap: 512
  nesting: true
  onboot: false
  unprivileged: true
  timezone: host
  start: false
  netdev_firewall: true
  nameserver: ""
  searchdomain: ""

# Set true (e.g. -e force_replication_rebuild=true) to tear down a VM's
# replication job + stale target volumes before reconfiguring, so it re-clones
# fresh. Needed after a VM is rebuilt (new disks won't match old replicas).
force_replication_rebuild: false

# Nodes that run a Ceph monitor. Keep this ODD (3 or 5) -- an even mon count
# raises quorum without raising fault tolerance. Defaults to every proxmox node.
ceph_mon_hosts: "{{ groups['proxmox'] }}"

# External corosync QDevice (qnetd) host. Empty = no tiebreaker. Only applied to
# an EVEN-node cluster; see tasks/setup/setup_qdevice.yml.
corosync_qdevice_host: ""

# Hyper-converged Ceph. Requires a cluster; skipped on a standalone node.
configure_ceph: true
