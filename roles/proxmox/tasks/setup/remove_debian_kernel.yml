---
# These hosts are built Debian-first (preseed) then have proxmox-ve layered on,
# which leaves the stock Debian kernel meta `linux-image-amd64` (and its images)
# installed. Left in place, a later `apt dist-upgrade` keeps pulling new Debian
# kernels and resolves the conflict by REMOVING proxmox-ve (the pve-apt-hook then
# aborts the upgrade). Remove the Debian kernel packages so the Proxmox kernel is
# the only one. Idempotent: a no-op once they're gone.
#
# Fail-safe: only acts when a *-pve kernel is currently booted, so we never remove
# the running kernel (e.g. on a fresh install still booted on the Debian kernel,
# this correctly skips until after the first reboot into the pve kernel).
# No reboot is triggered: removing a non-running kernel only needs update-grub,
# and this role runs across all nodes in parallel.

- name: Kernel cleanup | running kernel
  ansible.builtin.command: uname -r
  changed_when: false
  check_mode: false
  register: running_kernel

- name: Kernel cleanup | list installed stock Debian kernel packages
  # The [0-9]* glob also matches the Proxmox images (linux-image-6.8.x-pve-amd64),
  # so exclude anything with 'pve' — we must never remove the pve kernel.
  ansible.builtin.shell: |
    set -o pipefail
    dpkg-query -W -f='${Package}\n' 'linux-image-amd64' 'linux-image-[0-9]*-amd64' 2>/dev/null \
      | grep -v -- -pve | sort -u || true
  args:
    executable: /bin/bash
  changed_when: false
  check_mode: false
  register: debian_kernels

- name: Kernel cleanup | remove stock Debian kernels (only when booted on a -pve kernel)
  ansible.builtin.apt:
    name: "{{ debian_kernels.stdout_lines }}"
    state: absent
    purge: true
  register: debian_kernel_removed
  when:
    - "'pve' in running_kernel.stdout"
    - debian_kernels.stdout_lines | length > 0

- name: Kernel cleanup | refresh GRUB after removing kernels
  ansible.builtin.command: update-grub
  changed_when: true
  when: debian_kernel_removed.changed | default(false)
