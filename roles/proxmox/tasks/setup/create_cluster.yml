---
- name: Install python3-pexpect package
  ansible.builtin.apt:
    name: python3-pexpect
    state: present

- name: Create cluster on first node
  when: inventory_hostname == groups['proxmox'] | sort | first
  block:
    - name: Check if cluster exists
      ansible.builtin.command: pvecm status
      register: cluster_status
      changed_when: false
      failed_when: false

    - name: Create Proxmox cluster
      ansible.builtin.command: pvecm create {{ proxmox_cluster_name | d("domain | regex_replace('\..*$')") }}
      when: cluster_status.rc != 0

- name: Join other hosts to cluster
  when: inventory_hostname != groups['proxmox'] | sort | first
  block:
    # For a rebuilt former member, purge its stale corosync + ceph membership
    # (quorum-gated) before rejoining. No-op for a brand-new node.
    - name: Clean stale former-member state before (re)join
      ansible.builtin.include_tasks: rejoin_cleanup.yml

    - name: Check if host is in cluster
      ansible.builtin.command: pvecm status
      register: cluster_status
      changed_when: false
      failed_when: false

    - name: Debug | Cluster status
      ansible.builtin.debug:
        msg: "{{ cluster_status }}"

    - name: Get root password from Bitwarden # noqa: run-once[task]
      ansible.builtin.set_fact:
        root_password: "{{ lookup('community.general.bitwarden', 'proxmox_root', field='password')[0] }}"
      delegate_to: localhost
      no_log: true
      # run_once: true
      when: cluster_status.rc != 0

    - name: Join host to cluster
      ansible.builtin.expect:
        command: pvecm add {{ hostvars[groups['proxmox'] | sort | first]['ansible_host'] }} --force
        responses:
          "Please enter superuser \\(root\\) password for.*:": "{{ root_password }}"
          "Are you sure you want to continue connecting (yes/no)?": "yes"
        timeout: 30
      when:
        - cluster_status.rc != 0
        - root_password is defined
        - root_password | length > 0