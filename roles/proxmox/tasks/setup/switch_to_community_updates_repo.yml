---
- name: Ensure ca-certificates is installed
  ansible.builtin.apt:
    name: ca-certificates
    state: present

- name: Download Proxmox GPG key
  ansible.builtin.get_url:
    url: https://enterprise.proxmox.com/debian/proxmox-release-{{ debian_version }}.gpg
    dest: /etc/apt/trusted.gpg.d/proxmox-release-{{ debian_version }}.gpg
    mode: '0644'

- name: Remove enterprise repositories
  ansible.builtin.apt_repository:
    repo: "{{ item.repo }}"
    state: absent
    update_cache: true
    filename: "{{ item.filename }}"
  loop_control:
    label: "{{ item.filename }}"
  with_items:
    - { filename: pve, repo: "deb https://enterprise.proxmox.com/debian/pve bookworm pve-enterprise" }
    - { filename: ceph, repo: "deb https://enterprise.proxmox.com/debian/ceph-{{ ceph_release }} bookworm enterprise" }

- name: Add no-subscription repositories
  ansible.builtin.apt_repository:
    repo: "{{ item.repo }}"
    state: present
    update_cache: true
    filename: "{{ item.filename }}"
  loop_control:
    label: "{{ item.filename }}"
  with_items:
    - { filename: pve-no-subscription, repo: "deb http://download.proxmox.com/debian/pve bookworm pve-no-subscription" }
    - { filename: "ceph-{{ ceph_release }}-no-subscription", repo: "deb http://download.proxmox.com/debian/ceph-{{ ceph_release }} bookworm no-subscription" }
