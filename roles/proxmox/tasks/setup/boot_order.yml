---
# UEFI boot order: internal disk / OS first, then USB, then network last.
# Unlike serial/VT-x/power (AMI `Setup` varstore, baked in by the m910q pre-boot
# image), boot order lives in the EFI `BootOrder` variable -- firmware-confirmed
# via the Setup driver IFR (varstores BootOrder/LegacyDevOrder, GUIDs 8BE4DF61 /
# A56074DB, not `Setup`). setup_var.efi is `Setup`-only, so it cannot set it; we
# do it here on the installed host, where the nvme OS boot entry exists.
# See 02-proxmox/docs/firmware.md.
- name: Boot order - ensure efibootmgr is installed
  ansible.builtin.apt:
    name: efibootmgr
    state: present

- name: Boot order - detect UEFI boot (efivars present)
  ansible.builtin.stat:
    path: /sys/firmware/efi
  register: _efi_dir

- name: Boot order - set nvme -> USB -> network (idempotent)
  ansible.builtin.script: set_uefi_boot_order.py
  register: _uefi_boot_order
  changed_when: "_uefi_boot_order.stdout is match('changed:')"
  when: _efi_dir.stat.exists
